<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrarse</title>
    <link rel="stylesheet" href="../css/registrarse.css">
</head>
<body>
    <header class="conatiner-header">
        <h1>Eco Route Logistic</h1>
        <div class="container-opciones">
            <button class="boton-opciones btn-especial">
                <a href="../html/inicio-sesion.html">Iniciar Sesion</a>
            </button>
            <button class="boton-opciones">
                <a href="../html/registrarse.html">Registrase</a>
            </button>
        </div>
    </header>
    <main class="main">
        <section class="formulario">
            <div class="contenedor-titulo">
                <h3>Registrarse</h3>
            </div>
            <div class="contenedor-campos">
                <div class="contenedor-campo">
                    <div class="contenedor-label">
                        <label>Rut</label>
                        <b>*</b>
                    </div>
                    <input type="text">
                </div>
                <div class="contenedor-campo especial">
                    
                    <div class="contenedor-campo">
                        <div class="contenedor-label">
                            <label>Nombres</label>
                            <b>*</b>
                        </div>
                        <input type="text">
                    </div>
                    
                    <div class="contenedor-campo">
                        <div class="contenedor-label">
                            <label>Apellidos</label>
                            <b>*</b>
                        </div>
                        <input type="text">
                    </div>

                </div>
                <div class="contenedor-campo especial">
                    
                    <div class="contenedor-campo">
                        <div class="contenedor-label">
                            <label>Email</label>
                            <b>*</b>
                        </div>
                        <input type="text">
                    </div>
                    
                    <div class="contenedor-campo">
                        <div class="contenedor-label">
                            <label>Contraseña</label>
                            <b>*</b>
                        </div>
                        <input type="text">
                    </div>

                </div>
                <div class="contenedor-campo">
                    <div class="contenedor-label">
                        <label>Telefono</label>
                        <b>*</b>
                    </div>
                    <input type="password">
                </div>
            </div>
            <div class="contenedor-boton">
                <button>Registrarse</button>
            </div>
            <div class="contenedor-ultimo">
                <p>¿Ya tienes una cuenta? presiona <b>aca</b></p>
            </div>
        </section>
    </main>
</body>
</html>
